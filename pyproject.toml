[project]
authors = [{ name = "Lucas Offroy et al", email = "pierre.navaro@math.cnrs.fr" }]
dependencies = []
description = "Algorithm for Transfer Learning in Incomparable Domains using Optimal Transport"
name = "jdcoot"
requires-python = ">= 3.11"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
jdcoot = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.12.7,<4"
pandas = ">=2.2.3,<3"
matplotlib = ">=3.9.2,<4"
pot = ">=0.9.4,<0.10"
tf-keras = ">=2.17.0,<3"
scikit-learn = ">=1.5.2,<2"
alive-progress = ">=3.1.5,<4"

[tool.pixi.target.osx-64.dependencies]
pot = ">=0.9.5,<0.10"

[tool.pixi.commands]
test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
