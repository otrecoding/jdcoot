[project]
authors = [{ name = "Lucas Offroy et al", email = "pierre.navaro@math.cnrs.fr" }]
dependencies = [
    "numpy>=2.3.4",
    "pot>=0.9.6.post1",
]
description = "Algorithm for Transfer Learning in Incomparable Domains using Optimal Transport"
name = "jdcoot"
requires-python = ">= 3.11"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
jdcoot = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.12.7,<4"
pandas = ">=2.2.3,<3"
matplotlib = ">=3.10.1,<4"
pot = ">=0.9.5,<0.10"
tf-keras = "==2.18.0"
scikit-learn = ">=1.6.1,<2"
alive-progress = ">=3.2.0,<4"
seaborn = ">=0.13.2,<0.14"
pytest = ">=9.0.2,<10"

[tool.pixi.target.osx-64.dependencies]
pot = ">=0.9.5,<0.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
